[project]
name = "videoqa"
version = "0.1.0"
description = "Pipeline de revisión automática de videos (QA pre-publicación)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "gspread>=6.0",
    "google-auth>=2.0",
]

[project.optional-dependencies]
# Pila de Apple: solo se instala en macOS. En otras plataformas el motor
# funciona con los backends que registre quien lo use (ver videoqa/backends.py).
macos = [
    "mlx-whisper>=0.4",
    "ocrmac>=1.0",
    # Usado directamente por videoqa/checks/spelling.py (NSSpellChecker de AppKit).
    "pyobjc-framework-Cocoa>=10",
]

[project.scripts]
videoqa = "videoqa.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videoqa"]

[tool.hatch.build.targets.wheel.force-include]
"videoqa/prompts/revisor-video.md" = "videoqa/prompts/revisor-video.md"
"videoqa/reglas.yaml" = "videoqa/reglas.yaml"
"videoqa/data/glosario_base.txt" = "videoqa/data/glosario_base.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requiere modelos/CLI reales (Whisper, Claude); correr con VIDEOQA_SLOW=1"]
